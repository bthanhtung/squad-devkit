name: Feature request
description: Suggest an improvement to squad-devkit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should squad-devkit behave? Include commands or output if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Manager (planning, routing, verification)
        - Workers and engines
        - Worktrees and merging
        - Monitor panes and terminals
        - Installation and configuration
        - Documentation
        - Other
    validations:
      required: true
