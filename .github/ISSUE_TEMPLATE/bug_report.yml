name: Bug report
description: Something in squad-devkit does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove tokens, internal hostnames, and other private data from logs before pasting them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what happened instead.
      placeholder: |
        squad-worker dev-1 --engine codex --brief "..."
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd into a git repository
        2. squad-devkit "..."
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, or the tail of the worker log in .squad/workers/ (redacted).
      render: shell
  - type: input
    id: version
    attributes:
      label: squad-devkit version
      description: Output of `squad-devkit --version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, terminal (Herdr, tmux, Ghostty, iTerm2, ...), manager CLI, and worker engines with versions.
      placeholder: |
        macOS 15, bash 3.2, Ghostty 1.3
        claude 2.1.x (manager), codex 0.163 (workers)
    validations:
      required: true
