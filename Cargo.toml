[package]
name = "squad"
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-only"
description = "Multi-AI-agent terminal collaboration message bus CLI for squad-devkit (originally from mco-org/squad)"
repository = "https://github.com/bthanhtung/squad-devkit"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
